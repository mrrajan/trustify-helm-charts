suite: create-importers job
templates:
  - templates/init/create-importers/020-Job.yaml
set:
  appDomain: .test.example.com
  storage:
    type: filesystem
    size: 1Gi
  database:
    host: localhost
    name: trustify
    username: postgres
    password: postgres
tests:
  - it: renders when enabled
    set:
      modules.createImporters.enabled: true
    asserts:
      - isKind:
          of: Job

  - it: does not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: metadata name is create-importers
    set:
      modules.createImporters.enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: create-importers

  - it: Helm hook is post-install pre-upgrade
    set:
      modules.createImporters.enabled: true
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: "post-install,pre-upgrade"

  - it: Helm hook-weight is 40
    set:
      modules.createImporters.enabled: true
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "40"

  - it: PGHOST env var present
    set:
      modules.createImporters.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGHOST
            value: localhost

  - it: container command starts with psql
    set:
      modules.createImporters.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command[0]
          value: psql
