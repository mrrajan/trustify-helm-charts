suite: create-database configmap
templates:
  - templates/init/create-database/010-ConfigMap.yaml
set:
  appDomain: .test.example.com
  storage:
    type: filesystem
    size: 1Gi
  database:
    host: localhost
    name: trustify
    username: postgres
    password: postgres
tests:
  - it: renders when createDatabase enabled
    set:
      modules.createDatabase.enabled: true
    asserts:
      - isKind:
          of: ConfigMap

  - it: does not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: metadata name is create-db
    set:
      modules.createDatabase.enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: create-db

  - it: ArgoCD hook annotation present
    set:
      modules.createDatabase.enabled: true
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: PreSync

  - it: Helm hook annotation present
    set:
      modules.createDatabase.enabled: true
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: "pre-install,pre-upgrade"

  - it: data key init.sql exists
    set:
      modules.createDatabase.enabled: true
    asserts:
      - isNotNullOrEmpty:
          path: data["init.sql"]
