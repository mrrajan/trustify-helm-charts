suite: opentelemetry helpers
templates:
  - templates/services/server/030-Deployment.yaml
  - templates/services/server/020-ConfigMap-auth.yaml
set:
  appDomain: .test.example.com
  storage:
    type: filesystem
    size: 1Gi
  database:
    host: localhost
    name: trustify
    username: postgres
    password: postgres
tests:
  - it: OTEL_EXPORTER_OTLP_ENDPOINT present when metrics enabled
    template: templates/services/server/030-Deployment.yaml
    set:
      metrics:
        enabled: true
      collector:
        endpoint: "http://otel:4317"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://otel:4317"

  - it: OTEL_EXPORTER_OTLP_ENDPOINT not present when collector disabled
    template: templates/services/server/030-Deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
          any: true

  - it: OTEL_EXPORTER_OTLP_ENDPOINT value matches collector endpoint config
    template: templates/services/server/030-Deployment.yaml
    set:
      tracing:
        enabled: true
      collector:
        endpoint: "http://custom-collector:4318"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://custom-collector:4318"
