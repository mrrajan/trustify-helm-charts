suite: labels helpers
templates:
  - templates/services/server/030-Deployment.yaml
  - templates/services/server/020-ConfigMap-auth.yaml
set:
  appDomain: .test.example.com
  storage:
    type: filesystem
    size: 1Gi
  database:
    host: localhost
    name: trustify
    username: postgres
    password: postgres
tests:
  - it: should include app version label
    template: templates/services/server/030-Deployment.yaml
    asserts:
      - isNotNull:
          path: metadata.labels["app.kubernetes.io/version"]

  - it: should include managed-by Helm label
    template: templates/services/server/030-Deployment.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm

  - it: should include partOf label with default value
    template: templates/services/server/030-Deployment.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: "trustify"

  - it: should include selector label with resource name
    template: templates/services/server/030-Deployment.yaml
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: server

  - it: should include instance label in selector
    template: templates/services/server/030-Deployment.yaml
    asserts:
      - isNotNull:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
